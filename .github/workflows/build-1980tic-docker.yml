name: Build 1980 TIC Docker Image

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true  # ⭐ IMPORTANTE: Cargar imagen en Docker local
          tags: 1980tic-chatwoot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Export Docker image
        run: |
          docker save 1980tic-chatwoot:latest | gzip > 1980tic-chatwoot.tar.gz
          ls -lh 1980tic-chatwoot.tar.gz
      
      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1980tic-chatwoot-image
          path: 1980tic-chatwoot.tar.gz
          retention-days: 7
      
      - name: Build completed
        run: echo "✅ Docker image built and saved successfully!"

