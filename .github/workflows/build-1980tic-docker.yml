name: Build and Publish 1980 TIC Docker Image

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

env:
  DOCKER_REPO: tuusuario/1980tic-chatwoot  # Cambia "tuusuario" por tu usuario de Docker Hub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set Docker Tags
        id: meta
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DOCKER_TAG=${DOCKER_REPO}:latest" >> $GITHUB_ENV
            echo "VERSION_TAG=${DOCKER_REPO}:1.0.0" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=${DOCKER_REPO}:develop" >> $GITHUB_ENV
            echo "VERSION_TAG=${DOCKER_REPO}:dev-${{ github.sha }}" >> $GITHUB_ENV
          fi
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64  # Multi-plataforma
          push: true
          tags: |
            ${{ env.DOCKER_TAG }}
            ${{ env.VERSION_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_REPO }}:buildcache,mode=max
      
      - name: Image digest
        run: echo "Image pushed successfully!"
